name: GRBC Tests
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[grbc]'
      - run: PYTHONPATH=src python -m unittest discover -s tests/grbc -v
      - run: bash -n scripts/train_common.sh scripts/train_smolvla.sh scripts/train_xvla.sh scripts/train_pi05.sh
